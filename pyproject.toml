[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drift"
version = "0.1.0"
description = "DRIFT: claim-centric trajectory error-span localization."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
drift = "drift_open.cli:main"
drift-eval = "drift_open.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]
